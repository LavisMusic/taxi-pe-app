# Receptores de webhook (Caja -> Taxi-PE) y relays sin sesión de
# Supabase (pasajero no tiene JWT, su auth es la tabla 'usuarios') — la
# autenticación real es el HMAC (o, en mirror-a-caja, la verificación
# del PIN contra la tabla) hecha DENTRO de la función. Ver WEBHOOKS.md.
[functions.webhook-caja-mirror-cuenta]
verify_jwt = false

[functions.mirror-a-caja]
verify_jwt = false

# Canjea el ticket de entrada por una sesión de Supabase Auth: se llama
# justo ANTES de tener sesión (ver la migración 20261010100000).
[functions.taxi-sesion]
verify_jwt = false
